# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.
#
# Task granularity corrected 2026-09-17: an earlier version of this board had one Worker
# task per packet (8 total). Checked empirically: the source plan has 374 distinct named
# tests across its 8 packets, with P69-01/02/03/06/07 each carrying 9-22 lettered GREEN
# subsections (a real, verified structural feature of the plan document, not invented).
# One task per packet meant several single tasks covering 48-97 tests each — mega-tasks,
# not "largest safe useful slice." This version splits those 5 packets along their own
# lettered subsection groupings; P69-04/05/08 stay single tasks (genuinely small: 0-22
# tests, no lettered subsections). See goal.md's Slice Sizing section for the count table.

version: 2

goal:
  title: "Phase 69 — Dashboard and TUI Contract Remediation"
  slug: "phase-69-dashboard-tui-contract-remediation"
  kind: existing_plan
  tranche: "Implement all 8 packets (P69-01 through P69-08) of docs/phase-plans/phase-69-dashboard-tui-contract-remediation-plan.md, in the plan's own required order, split into 24 Worker sub-tasks along the plan's own lettered subsection groupings, until the final Judge audit (T999) confirms full_outcome_complete: true against the plan's own §5 completion criteria."
  status: done
  oracle:
    signal: "env -u VIRTUAL_ENV -u PYTHONPATH .venv/bin/python -m pytest -q (full suite) green, plus scripts/sync_docs.py --check clean of Phase 66/69 entries (P69-08.3's own VERIFY), plus a final Judge audit mapping every packet's receipt back to Phase 66 §0's rows."
    cadence: "after each packet-closing Worker sub-task's full official VERIFY, at every Judge checkpoint (T001, T007, T013, T019, T022, T029), and at final audit (T999)"
    final_proof: "Every Phase 66 §0 row (1-18, 20-24) has a passing named test proving the gap closed, with only the 3 named exceptions (row 19 pre-closed; row 18 threshold sign-off; row 13 Windows-console sub-item accepted as blocked in this darwin-only environment), per plan §5."
  intake:
    original_request: "User ran /goal-prep Phase 68; Phase 68's own dependency graph blocks P68-04/05/06/07 on unimplemented Phase 69 work (confirmed: zero Phase 69 implementation commits in git log). User redirected with /goal-prep Phase 69 to prepare the real prerequisite first. User then challenged the first board draft's 12-task granularity against a ~300KB plan; checked empirically and confirmed the challenge was correct — rebuilt at 31 tasks."
    interpreted_outcome: "Implement Phase 69 in full (all 8 packets, split into right-sized sub-tasks) per its own existing, adversarially-reviewed plan, closing the 23 actionable Phase 66 §0 gaps and unblocking Phase 68's P68-04 through P68-07."
    input_shape: existing_plan
    audience: "Rush maintainer (repo owner); dashboard/TUI's real end users are developers running rush dashboard/rush ui"
    authority: requested
    proof_type: test
    completion_proof: "Full pytest suite green + sync_docs.py --check clean of Phase 66/69 entries + final Judge audit mapping receipts to Phase 66 §0 rows, per plan §5."
    likely_misfire: "Treating a sub-task's own scoped test run going green as proof of more than it covers — an earlier sub-task's own targeted tests passing while sibling not-yet-built-subsection tests in the same file stay red is expected, not a regression, but the packet is not actually done until its LAST sub-task's full official VERIFY command is green; conflating 'this sub-task's slice is green' with 'this packet is done' is the exact misfire the earlier 12-task board fell into by accident (one task per packet made every task look packet-complete when it wasn't scoped that way at all)."
    blind_spots_considered:
      - "This session's environment is macOS only (uname -s -> Darwin, no Windows/Linux host reachable) — Windows/Linux-specific mechanisms in P69-01 and P69-05 can be implemented per spec and logic-tested here, but their platform-gated assertions can't run on the real target OS; name the gap per sub-task receipt."
      - "P69-04/P69-05 VERIFY steps require a real live browser session (browser-qa-agent/e2e-runner, or mcp__claude-in-chrome__* directly) against a live rush dashboard instance, not just pytest — confirm this mechanism works before committing to those packets (T019 checkpoint)."
      - "Packets are strictly sequential (02 depends on 01's new primitives, 03 on 01+02, 04/05 on 03's map data, 06/07 share files with 01/02/03) — max_write_workers: 1 already enforces serial execution; sub-tasks within a split packet are also sequential (later subsections build on earlier ones' new code in the same shared files)."
      - "Within a split packet, only the packet-closing sub-task's full official VERIFY command is the real completion gate — earlier sub-tasks verify a named, scoped subset of the packet's own RED tests and are expected to leave sibling tests (for subsections not yet implemented) red."
      - "P69-01 is independently shippable per the plan's own §1 and is the one packet Phase 68's P68-05 actually needs — its 5 sub-tasks (T002-T006) are a real milestone once T006 (the packet-closing one) is green."
    existing_plan_facts:
      - "Packet order per plan §5: P69-01 -> P69-02 -> P69-03 -> P69-04 -> P69-05 -> P69-06 -> P69-07 -> P69-08. 02-07 build on 01's hardened auth/session boundary; 08 documents what the others closed."
      - "Per-packet test/subsection counts, counted directly from the source plan this session: P69-01=60 tests/16 subsections(a-p), P69-02=97/16(a-p), P69-03=88/22(a-v), P69-04=8/0, P69-05=22/0, P69-06=49/9(a-i), P69-07=48/16(9 contract-rule a-i + 7 GREEN-impl a-g), P69-08=2/0. Sum of per-packet distinct tests: 374 (some test names are shared/repeated across packet boundaries, so this is not identical to the whole-document unique count of 389)."
      - "Shared files (server.py, auth.py, state.py, tui.py) are touched by multiple packets AND by multiple sub-tasks within one packet, in sequence — each sub-task's own RED step must re-read the current file before editing (plan §2); citations may have shifted from an earlier sub-task's own edits, not just an earlier packet's."
      - "Baseline test health, established this session (2026-09-17): the 14 pre-existing dashboard/TUI test files pass 116/116, 0 failed. tests/test_dashboard_missing_routes.py does not exist yet — created fresh by P69-02's RED step (assigned to T008, subsection a) per the plan."
      - "GoalBuddy agents installed and verified this session: ~/.claude/agents/goal-scout.md, goal-judge.md, goal-worker.md all present."
      - "No existing worktree, branch, or goal board for Phase 69 prior to this prep (verified via git worktree list, git branch -a --list '*69*', find docs/goals -iname '*69*')."
      - "Phase 68's P68-05 depends ONLY on P69-01 (not the whole phase) per Phase 68 plan §5 and Phase 69 plan §1 — P68-04 additionally depends on P69-02/P69-03/P69-04/P69-05."
      - "Plan's own completion exceptions (§5): row 19 already closed by Phase 66's own §0; row 18's 250ms threshold is a sign-off decision (P69-08's own work); row 13's Windows-console sub-item is a named, accepted blocker with no Windows machine in this environment — the rest of row 13 (interactive-shell timing, browser-pixel-rendering once the browser mechanism is available) still closes for real."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

