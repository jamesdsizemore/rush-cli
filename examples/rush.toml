# Conservative Rush configuration. Copy to a project root as rush.toml.
log_level = "warn"

[project]
src = ["src"]
test = ["tests"]
exclude = ["**/.venv/**", "**/node_modules/**"]

[review]
max_file_lines = 400
use_graft = false
scaffold_markers = []
source_policy_exclude = ["tests/fixtures/**"]

# lint is the verified consumer of generic engine_args.
[tools.lint]
engine_args = []

[tools.mutation]
source_paths = ["src"]
test_paths = ["tests"]
timeout_seconds = 300

[tools.fuzz]
harness = "fuzz/harness.py"
corpus = "fuzz/corpus"
seed = 0
max_runs = 1000
timeout_seconds = 60

[tools.load]
script = "load/scenario.js"
target_url = "http://127.0.0.1:8000/"
vus = 1
duration_seconds = 10
timeout_seconds = 60

[tools.contract]
pact_files = ["pacts/consumer.json"]
provider_url = "http://127.0.0.1:8000/"
timeout_seconds = 60

[tools.attest]
# Select the actual built artifact through the current CLI:
# rush attest . --artifact-path dist/RELEASE.whl
# The legacy target_artifact configuration key is not consumed.

[tools.license-matrix]
allowed_licenses = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC"]

[tools.prompt-eval]
pass_rate_threshold = 1.0
max_tokens = 25000
max_cost = 0.25

[tools.error-catalog]
operation = "audit"

[tools.mem-profile]
mode = "static"

[tools.cold-start]
mode = "static"
threshold_ms = 50.0

[tools.media-opt]
operation = "audit"

[tools.dead-asset]
operation = "audit"

[tools.pr-synthesize]
base_ref = "main"

[tools.patch-apply]
dry_run = true
circuit_breaker = true
allow_artifact_write = false
