      2. Make expand_group filter-consistent with build_project_map: it must accept and honor the SAME active filters (node_types, severity, query, status) that produced the group's member_count, so member_count metadata never diverges from what expand_group actually returns for that group under those filters. T303 reproduced a 3000-vs-20000 mismatch calling expand_group with no filter args against a group whose member_count was computed with a severity filter -- fix this at the root (thread filters through, do not just patch the repro case).
      3. src/rush/dashboard/server.py:614-628's map handler wires node_types/severity/query into build_project_map but never 'status' (named in docs/phase-plans/phase-66-interactive-tui-and-local-web-plan.md section 3.5's filter list) or 'cursor'. Wire both. build_project_map's own `cursor` parameter (project_map.py:410) is currently unused dead code and the response hardcodes next_cursor=None (project_map.py:457) -- make cursor-based pagination real end-to-end (route param -> build_project_map/expand_group -> real next_cursor in the JSON response -> JS caller uses it).
      4. src/rush/dashboard/project_map.js contains a literal NUL byte at offset ~1372, inside sortKey()'s template literal (`` `${node.path || ""}\x00${node.id}` ``). This makes the file byte-classified as binary (grep/file tools silently skip it, undetectable by this repo's Python-only lint pipeline). Replace the NUL separator with a safe two-field comparison (e.g. compare node.path and node.id as a tuple/array instead of concatenating into one string) so no NUL byte is ever written to this file again.
      5. tests/test_dashboard_projects.py:178-197 (test_stale_response_after_switch_is_ignored) is mislabeled: it fires 20 concurrent GETs to two distinct project URLs and asserts each response's own project_id matches its own URL -- this tests server-side per-request correctness, not client-side stale-response discarding, and leaves application.js's real race guard (selectProject/loadMap/isCurrentGeneration) with zero automated coverage. Rename this existing test to something accurate (e.g. test_concurrent_requests_return_correct_project_each) reflecting what it actually verifies, and add a NEW test that actually exercises application.js's client-side generation-guard: write a small Node harness script (e.g. tests/fixtures/dashboard/race_guard_harness.mjs or inline in a test helper) that imports/evaluates the real application.js, mocks fetch so project-a's response is delayed (e.g. 300ms) and project-b's is fast (e.g. 10ms), calls selectProject('project-a') then immediately selectProject('project-b'), and asserts only project-b's data is ever rendered/returned -- mirroring exactly the repro T303's Judge already ran by hand. Wire this as a real pytest test that shells out to `node` via subprocess and asserts on its exit code/stdout, so it runs in the normal test suite, not as a one-off manual script.
