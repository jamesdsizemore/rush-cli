  - id: T014
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: high
    objective: |
      Complete P65-03's own share of the plan's section 6.1 frozen storage/identity/envelope contract, which section 6.1 explicitly assigns: "P65-03 owns registry/envelope tests." T204/T097/T013 built the operations (add/list/show/select/configure/create/relink) and CLI/MCP wiring but never implemented the revision/concurrency contract or the canonical request/response envelope. snapshot/artifacts/expand operations are explicitly P65-07's ownership per the same sentence -- do NOT implement them here.
      Exact contract to implement (docs/phase-plans/phase-65-project-provisioning-scan-and-agent-workflow-plan.md, section 6.1, read it in full first):
      1. "The user registry maps project_id to physical root, descriptor identity and integer revision; descriptor holds the same UUID, schema version and creation timestamp." Add an integer `revision` field to the project registry entry (ProjectRecord / projects.json), starting at a defined initial value, incremented on every successful mutation.
      2. "relink requires matching descriptor UUID at the new physical root and expected registry revision; it never adopts another descriptor or guesses from a remote URL." relink_project must take an `expected_revision` parameter and fail with REVISION_CONFLICT on mismatch.
      3. "configure preview returns an immutable plan with canonical SHA256 plan_id; apply requires that ID plus artifact_write, matching source revision and exact settings." configure_project needs a preview mode (no expected_revision/apply -> returns a plan_id computed as SHA256 over canonical JSON of the proposed settings) and an apply mode (plan_id + expected_revision + artifact_write required -> validates plan_id matches current settings hash, applies, increments revision). Wrong plan_id or stale plan returns PLAN_STALE.
      4. "Mutations take expected_revision and compare under existing lock; lock timeout 5 seconds returns BUSY, never overwrites concurrent updates." add/create/relink/configure (the _WRITE_ACTIONS) must accept expected_revision (required for relink/configure on an existing project; not applicable to add/create since there is no prior revision), compare it against the registry's current revision under the existing file lock used elsewhere in this codebase, return BUSY on a 5-second lock-acquisition timeout, and REVISION_CONFLICT on a stale expected_revision -- never silently overwrite.
      5. "Every new MCP entry accepts exactly one request: dict with schema_version: 1 and operation-specific fields... Return canonical ToolResult; put typed payload in raw={schema_version:1,operation:...,data:...,error:null|{code:...,message:...,retryable:bool}}." Wrap rush_project's request/response through this canonical envelope shape (ProjectTool's call boundary) -- reject unknown keys, malformed UUID, out-of-range bounds before any effect with INVALID_REQUEST.
      6. Common errors this operation must be able to raise per section 6.1's list, no more: INVALID_REQUEST, PROJECT_NOT_FOUND, PROJECT_ROOT_MISSING, PROJECT_ROOT_CONFLICT, PROJECT_DESTINATION_EXISTS, REVISION_CONFLICT, SCOPE_DENIED, BUSY, PLAN_STALE. "No project argument and no interface-bound selection returns PROJECT_REQUIRED." "Selection is per authenticated local interface/session and never persisted as an account-global active project."
      7. Cursor authentication for `list`: "encode base64url(payload).base64url(HMAC-SHA256(key,payload_bytes)) without padding; key is 32 random bytes in user data cursor.key, created during authorized global setup with owner-only permissions and retained across restarts. Query paths never silently create the key; missing key returns SETUP_REQUIRED. Verify signature with constant-time comparison before decoding scope/position; changed filters, project, last_id, malformed signature or unavailable key fail INVALID_CURSOR." Payload shape: base64url canonical {schema_version:1,project_id,query_hash,last_created_at,last_id}, ordering (created_at,id) ascending, pagination range 1-200.
      Do not implement snapshot/artifacts/expand (P65-07's scope). Do not touch scan/run/handoff infrastructure (P65-04/P65-06/P65-07's scope) -- this task is registry/envelope only, scoped to rush_project's existing 7 operations.
    inputs:
