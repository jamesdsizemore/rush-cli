    final_proof: "Stage 1: oracle command block green with zero exclusions, cited verbatim in a Judge receipt. Full goal: Stage 1 proof plus each of MC02-14/P65-01..10/P66-01..07 verified against its own plan's named acceptance tests/evidence requirements."
