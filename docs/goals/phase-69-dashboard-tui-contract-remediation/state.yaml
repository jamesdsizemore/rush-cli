# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.
#
# Task granularity corrected 2026-09-17: an earlier version of this board had one Worker
# task per packet (8 total). Checked empirically: the source plan has 374 distinct named
# tests across its 8 packets, with P69-01/02/03/06/07 each carrying 9-22 lettered GREEN
# subsections (a real, verified structural feature of the plan document, not invented).
# One task per packet meant several single tasks covering 48-97 tests each — mega-tasks,
# not "largest safe useful slice." This version splits those 5 packets along their own
# lettered subsection groupings; P69-04/05/08 stay single tasks (genuinely small: 0-22
# tests, no lettered subsections). See goal.md's Slice Sizing section for the count table.

version: 2

goal:
  title: "Phase 69 — Dashboard and TUI Contract Remediation"
  slug: "phase-69-dashboard-tui-contract-remediation"
  kind: existing_plan
  tranche: "Implement all 8 packets (P69-01 through P69-08) of docs/phase-plans/phase-69-dashboard-tui-contract-remediation-plan.md, in the plan's own required order, split into 24 Worker sub-tasks along the plan's own lettered subsection groupings, until the final Judge audit (T999) confirms full_outcome_complete: true against the plan's own §5 completion criteria."
  status: active
  oracle:
    signal: "env -u VIRTUAL_ENV -u PYTHONPATH .venv/bin/python -m pytest -q (full suite) green, plus scripts/sync_docs.py --check clean of Phase 66/69 entries (P69-08.3's own VERIFY), plus a final Judge audit mapping every packet's receipt back to Phase 66 §0's rows."
    cadence: "after each packet-closing Worker sub-task's full official VERIFY, at every Judge checkpoint (T001, T007, T013, T019, T022, T029), and at final audit (T999)"
    final_proof: "Every Phase 66 §0 row (1-18, 20-24) has a passing named test proving the gap closed, with only the 3 named exceptions (row 19 pre-closed; row 18 threshold sign-off; row 13 Windows-console sub-item accepted as blocked in this darwin-only environment), per plan §5."
  intake:
    original_request: "User ran /goal-prep Phase 68; Phase 68's own dependency graph blocks P68-04/05/06/07 on unimplemented Phase 69 work (confirmed: zero Phase 69 implementation commits in git log). User redirected with /goal-prep Phase 69 to prepare the real prerequisite first. User then challenged the first board draft's 12-task granularity against a ~300KB plan; checked empirically and confirmed the challenge was correct — rebuilt at 31 tasks."
    interpreted_outcome: "Implement Phase 69 in full (all 8 packets, split into right-sized sub-tasks) per its own existing, adversarially-reviewed plan, closing the 23 actionable Phase 66 §0 gaps and unblocking Phase 68's P68-04 through P68-07."
    input_shape: existing_plan
    audience: "Rush maintainer (repo owner); dashboard/TUI's real end users are developers running rush dashboard/rush ui"
    authority: requested
    proof_type: test
    completion_proof: "Full pytest suite green + sync_docs.py --check clean of Phase 66/69 entries + final Judge audit mapping receipts to Phase 66 §0 rows, per plan §5."
    likely_misfire: "Treating a sub-task's own scoped test run going green as proof of more than it covers — an earlier sub-task's own targeted tests passing while sibling not-yet-built-subsection tests in the same file stay red is expected, not a regression, but the packet is not actually done until its LAST sub-task's full official VERIFY command is green; conflating 'this sub-task's slice is green' with 'this packet is done' is the exact misfire the earlier 12-task board fell into by accident (one task per packet made every task look packet-complete when it wasn't scoped that way at all)."
    blind_spots_considered:
      - "This session's environment is macOS only (uname -s -> Darwin, no Windows/Linux host reachable) — Windows/Linux-specific mechanisms in P69-01 and P69-05 can be implemented per spec and logic-tested here, but their platform-gated assertions can't run on the real target OS; name the gap per sub-task receipt."
