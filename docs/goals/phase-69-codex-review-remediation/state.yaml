    existing_plan_facts:
      - "Review doc §9 'Findings / repair boundary' table groups all 51 findings by shared existing test files — this goal's task boundaries are read directly off that table."
      - "Review doc §9 'Repair sequence' (1-5): execution-safety findings first, then provenance/ownership, then user-facing browser/terminal routes, then U09's harness fix + full regression run, then documentation reconciliation + final independent re-review."
