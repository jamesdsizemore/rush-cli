name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone Executables
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset_name: rush-darwin-arm64.tar.gz
            binary_name: rush
          # macOS x86_64 is no longer a free GitHub-hosted runner tier; macos-15-intel is a
          # paid "large" runner. Kept here (not omitted) per the acceptance matrix contract:
          # an unsupported free tier is a blocker to resolve, not a platform to drop silently.
          - runner: macos-15-intel
            asset_name: rush-darwin-x86_64.tar.gz
            binary_name: rush
          - runner: ubuntu-latest
            asset_name: rush-linux-x86_64.tar.gz
            binary_name: rush
          - runner: ubuntu-24.04-arm
            asset_name: rush-linux-arm64.tar.gz
            binary_name: rush
          - runner: windows-latest
            asset_name: rush-windows-x86_64.zip
            binary_name: rush.exe
          - runner: windows-11-arm
            asset_name: rush-windows-arm64.zip
            binary_name: rush.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-extras --frozen

      - name: Install packaging tool
        run: uv pip install pyinstaller

      - name: Pre-release typecheck gate (mypy)
        run: uv run mypy src/rush

      - name: Resolve version from package metadata
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write standalone entry point
        shell: bash
        run: |
          cat > rush_entry.py <<'PYEOF'
          from rush.cli import cli

          if __name__ == "__main__":
              cli()
          PYEOF

      - name: Compile standalone binary
        run: |
          uv run pyinstaller --onefile --name rush --paths src --collect-data license_expression rush_entry.py

      - name: Package named archive with version metadata (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release_stage
          cp dist/rush release_stage/rush
          chmod +x release_stage/rush
          echo "${{ steps.version.outputs.version }}" > release_stage/VERSION
          tar -C release_stage -czf ${{ matrix.asset_name }} rush VERSION

      - name: Package named archive with version metadata (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_stage | Out-Null
          Copy-Item dist/rush.exe release_stage/rush.exe
          Set-Content -Path release_stage/VERSION -Value "${{ steps.version.outputs.version }}"
          Compress-Archive -Path release_stage/* -DestinationPath ${{ matrix.asset_name }}

      - name: Move archive into dist for probing
        shell: bash
        run: |
          rm -f dist/rush dist/rush.exe
          mv ${{ matrix.asset_name }} dist/${{ matrix.asset_name }}

      - name: Probe extracted native artifact (origin, version, MCP initialize)
        shell: bash
        run: |
          uv run python scripts/probe_installed_artifacts.py --json

      - name: Upload release asset
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/${{ matrix.asset_name }}

  checksums:
    name: Publish SHA256SUMS
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download published release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" --dir dist --pattern "rush-*"

      - name: Generate SHA256SUMS from exact bytes
        run: |
          python -c "
          from pathlib import Path
          from scripts.probe_installed_artifacts import write_sha256sums
          archives = sorted(Path('dist').glob('rush-*.tar.gz')) + sorted(Path('dist').glob('rush-*.zip'))
          write_sha256sums(archives, Path('dist/SHA256SUMS'))
          "

      - name: Upload checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/SHA256SUMS --clobber
