# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "CI dependency installation — stop skipping tests for missing tools"
  slug: "ci-dependency-installation"
  kind: existing_plan
  tranche: "Validate, implement, and CI-verify docs/phase-plans/ci-dependency-installation-plan.md on a dedicated branch, then stop for the user's merge decision."
  status: done
  completion_note: "full_outcome_complete: true per T006's final audit (CI run 34768489692, zero skips, all 7 jobs green). PR #1 (phase/ci-dependency-installation -> main) merged into main at James's explicit instruction ('merge it into main'), commit f040d2d, 2026-09-13T16:41:46Z. Post-merge CI run 34769358880 on main independently verified by PM: all 7 jobs green, zero SKIPPED and zero FAILED/ERROR across every job's raw log (pulled directly via gh api, not inferred from job conclusions). Goal fully and finally complete on main."
  oracle:
    signal: "gh run view <run-id> --json jobs -q '.jobs[] | {name, conclusion}' shows every job green AND zero SKIPPED lines anywhere in the run's job logs -- not just the original 9 named items. CORRECTED 2026-09-13: James's standing rule is zero skips, period; the 5 pre-existing test_executed_modes.py real_workload skips in Quality and tests must also be eliminated (deselected there, since they already run for real in Executed workload contracts)."
    cadence: "after each Worker package and at final audit"
    final_proof: "CI run on phase/ci-dependency-installation shows every job green AND zero SKIPPED lines in any job's log."
  intake:
    original_request: "/goal-prep ci-dependency-installation-plan.md"
    interpreted_outcome: "Every dependency the 9 skipped tests need is really installed in CI, verified by an actual green run with those skips gone, without breaking any other job."
    input_shape: existing_plan
    audience: "James (repo owner) / future CI reliability"
    authority: requested
    proof_type: test
    completion_proof: "CI run on the dedicated branch matches the oracle signal exactly."
    likely_misfire: "Declaring success from job conclusion=success without grepping the Run tests log for the 9 specific skip lines; or pinning knip/jscpd to latest instead of the tested major (verified breakage risk to existing normalizers)."
    blind_spots_considered:
      - "rush.__version__ accessor was never confirmed in the plan; must verify before touching build_release_archive."
      - "PyInstaller build adds real wall-clock time to Quality and tests; watch for job timeout."
      - "npm has no cache configured on the new job; acceptable, not a correctness risk."
    existing_plan_facts:
      - "docs/phase-plans/ci-dependency-installation-plan.md is the source of truth for pinned versions and YAML."
      - "Pins: vulture==2.16, radon==6.0.1, sloppylint==0.5.1, knip@5.88.1, jscpd@3.5.10, prettier@3.9.6, promptfoo@0.123.0."
      - "New job static-tool-acceptance (ubuntu-latest) installs the pip + npm tools and runs tests/test_static_tools.py tests/test_ai_eval.py tests/test_engines.py."
      - "Quality and tests job gains one new step before Run tests: install pyinstaller, run the exact release.yml pyinstaller --onefile invocation, then call build_release_archive to produce dist/rush-linux-x86_64.tar.gz."
      - "Do not touch engine-contracts, windows-contracts, artifact-probes, or representative-engines jobs."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # goal-scout / goal-worker / goal-judge confirmed present in this session's
  # available Agent tool types (direct evidence, not inferred).
  scout: installed
  worker: installed
  judge: installed

