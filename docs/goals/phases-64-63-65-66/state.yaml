    original_request: "Start on stage 1 using TDD, testing, error logs, and updating backlog/issues docs for any problems. Complete stage 1 fully and comprehensively before starting on the remaining work. Use subagents to complete this work faster. Review and address all issues in subagent work before integration. Scope your work tight to prevent drift and working off plan. Do not descope or degrade anything you are asked to do in the plans, implement them fully and completely. Do not stop until all phases are complete. Do not work on main."
