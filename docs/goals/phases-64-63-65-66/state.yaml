    audience: James (repo owner)
    authority: approved
    proof_type: test
    completion_proof: "Oracle command block green with zero exclusions (Stage 1); each Stage 2 plan's own acceptance criteria met (full goal)."
    likely_misfire: "Declaring a stage done on a passing focused test, a commit, or a status doc alone, the exact pattern the outgoing agent's handoff flags as already having happened once on this branch."
    blind_spots_considered:
      - "MC01's four modules share one transaction mechanism -- must be one Worker package with one owner, never split across parallel writers."
      - "Phase 64's evidence doc only records 2 of many packets -- its silence on the rest is not evidence they're either done or untouched; a Scout must check real source, not just the evidence doc."
      - "sync_docs contract drift may reflect implemented-but-undocumented behavior (e.g. rush_ship_clean already has apply/allow_artifact_write in code per the evidence doc, but the recorded contract still says dry_run) -- fix may be 'update the recorded contract' not 'add the feature', and Stage 1 work must tell those apart per finding rather than assuming every mismatch is a missing feature."
