      - "Within a split packet, only the packet-closing sub-task's full official VERIFY command is the real completion gate — earlier sub-tasks verify a named, scoped subset of the packet's own RED tests and are expected to leave sibling tests (for subsections not yet implemented) red."
      - "P69-01 is independently shippable per the plan's own §1 and is the one packet Phase 68's P68-05 actually needs — its 5 sub-tasks (T002-T006) are a real milestone once T006 (the packet-closing one) is green."
    existing_plan_facts:
      - "Packet order per plan §5: P69-01 -> P69-02 -> P69-03 -> P69-04 -> P69-05 -> P69-06 -> P69-07 -> P69-08. 02-07 build on 01's hardened auth/session boundary; 08 documents what the others closed."
      - "Per-packet test/subsection counts, counted directly from the source plan this session: P69-01=60 tests/16 subsections(a-p), P69-02=97/16(a-p), P69-03=88/22(a-v), P69-04=8/0, P69-05=22/0, P69-06=49/9(a-i), P69-07=48/16(9 contract-rule a-i + 7 GREEN-impl a-g), P69-08=2/0. Sum of per-packet distinct tests: 374 (some test names are shared/repeated across packet boundaries, so this is not identical to the whole-document unique count of 389)."
      - "Shared files (server.py, auth.py, state.py, tui.py) are touched by multiple packets AND by multiple sub-tasks within one packet, in sequence — each sub-task's own RED step must re-read the current file before editing (plan §2); citations may have shifted from an earlier sub-task's own edits, not just an earlier packet's."
      - "Baseline test health, established this session (2026-09-17): the 14 pre-existing dashboard/TUI test files pass 116/116, 0 failed. tests/test_dashboard_missing_routes.py does not exist yet — created fresh by P69-02's RED step (assigned to T008, subsection a) per the plan."
      - "GoalBuddy agents installed and verified this session: ~/.claude/agents/goal-scout.md, goal-judge.md, goal-worker.md all present."
      - "No existing worktree, branch, or goal board for Phase 69 prior to this prep (verified via git worktree list, git branch -a --list '*69*', find docs/goals -iname '*69*')."
      - "Phase 68's P68-05 depends ONLY on P69-01 (not the whole phase) per Phase 68 plan §5 and Phase 69 plan §1 — P68-04 additionally depends on P69-02/P69-03/P69-04/P69-05."
      - "Plan's own completion exceptions (§5): row 19 already closed by Phase 66's own §0; row 18's 250ms threshold is a sign-off decision (P69-08's own work); row 13's Windows-console sub-item is a named, accepted blocker with no Windows machine in this environment — the rest of row 13 (interactive-shell timing, browser-pixel-rendering once the browser mechanism is available) still closes for real."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

