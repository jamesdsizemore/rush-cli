      - "Finding 8's guard (memory.py:62, path-traversal check on scenario_id) is kept, not removed — test_memory_probe_repeat_isolated_and_rejects_unsafe_id depends on it as a public-API defense-in-depth boundary."
      - "Finding 9's duplicate count corrected from the review's claimed 3 occurrences to the real 2 (fixtures.py:43 and :148; fixtures.py:75 is an unrelated 10-key set)."
      - "Task A6 (Finding 1) requires real MemoryTool API calls verified this session: compact-view ask via request={'view':'compact',...} -> _compact_query -> recall_page (returns items/next_cursor/complete/tokens/bytes); edit operation via request={'scope','id','expected_version','content','apply':True}; maintain operation via task='expiry_sweep' -> sweep_expired(); legacy search() filters only archived_at, not expired_at, while search_candidates() (compact path) filters both."
      - "Git status at goal-prep time: scripts/benchmarks/memory.py, scripts/benchmarks/fixtures.py, tests/test_benchmark_memory.py, tests/test_benchmark_contracts.py were all clean/untouched (only .DS_Store and the plan doc itself were untracked) — no drift between plan-writing and goal-prep."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: false
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  tdd_red_before_green_required: true
  adversarial_review_required_per_slice: true
  touch_list_enforced: true
  never_commits_to_main_or_master: true
  never_commits_to_base_branch_directly: true
  never_merges: true
  never_pushes: true
  dedicated_branch_required_before_first_commit: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed
  worker: installed
  judge: installed

