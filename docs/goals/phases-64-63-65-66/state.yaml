    signal: "env -u VIRTUAL_ENV -u PYTHONPATH .venv/bin/python -m pytest tests/ -q && ruff check src tests scripts && ruff format --check src tests scripts && mypy src/rush && python scripts/sync_docs.py --check -- all five exit 0, zero collection errors, zero unresolved skips beyond a named external blocker, zero contract/sha drift"
