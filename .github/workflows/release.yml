name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone Executables
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: rush-linux-x86_64
            asset_name: rush-linux-x86_64.tar.gz
          - os: macos-latest
            artifact_name: rush-darwin-arm64
            asset_name: rush-darwin-arm64.tar.gz
          - os: windows-latest
            artifact_name: rush-windows-x86_64.exe
            asset_name: rush-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .

      - name: Compile Standalone Binary
        run: |
          pyinstaller --onefile --name rush src/rush/cli.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87238604da99376a6cb63 # v2.2.1
        with:
          files: dist/*
