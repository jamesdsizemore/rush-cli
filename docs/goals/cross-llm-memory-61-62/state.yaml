# GoalBuddy v2 state.yaml — Cross-LLM Memory System: Phase 61 + Phase 62
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Cross-LLM Memory System: Phase 61 + Phase 62"
  slug: "cross-llm-memory-61-62"
  kind: existing_plan
  tranche: "Implement Phase 61 (14 workstreams, 39 contract tests) then Phase 62 (8 workstreams, 26 contract tests) exactly as specified in docs/phase-plans/phase-61-cross-llm-memory-typed-artifact-schema-plan.md and docs/phase-plans/phase-62-memory-integration-layer-plan.md. Phase 62 does not start until Phase 61's exit checklist is 100% checked."
  status: done
  oracle:
    signal: "python -m pytest tests/ -q passes at (pre-goal baseline) + 65 (39 Phase 61 + 26 Phase 62) named contract tests; both plans' §10 delivery-gate command blocks all succeed; every box in both plans' §11 Exit Checklists is checked."
    cadence: "after each Worker package's own verify commands, and at the two phase-boundary Judge audits (T016, T028)"
    final_proof: "T028's Judge receipt records the full pytest count, both §10 gate results, and both §11 checklists fully checked before full_outcome_complete: true."
  intake:
    original_request: "docs/phase-plans/phase-61-cross-llm-memory-typed-artifact-schema-plan.md and docs/phase-plans/phase-62-memory-integration-layer-plan.md — create a new worktree, ensure GoalBuddy agents are installed, enable and activate the local goal board in the browser, review the goal-prep decomposition prior to handoff and address all issues."
    interpreted_outcome: "Implement Phase 61 and Phase 62 of rush-cli's cross-LLM memory system exactly as specified in the two accepted implementation-ready plans, via TDD, in a dedicated worktree/branch, with a local visual board active."
    input_shape: existing_plan
    audience: "rush-cli maintainer (repo owner); future cross-LLM tool integrations reading rush's memory subsystem"
    authority: approved
    proof_type: test
    completion_proof: "python -m pytest tests/ -q at baseline + 65; both §11 Exit Checklists 100% checked; both §10 gates green."
    likely_misfire: "Executing tasks out of the plans' own Prerequisites order; downscoping a task's Binary Outcome; starting Phase 62 before Phase 61's exit checklist is 100% checked; re-deriving a design decision from memory instead of the cited plan section and drifting from an already-corrected signature/invariant (e.g. MultiModelConsensusReconciler reuse for corroboration counting, GroundingVerifier reuse for symbol grounding — both explicitly wrong per the plan's own corrections)."
    blind_spots_considered:
      - "P62.7 TTL durations were an open decision at first draft — already resolved (14/30/90 days) and recorded in the plan before this board was built."
      - "Zero new third-party dependencies in either phase — Python 3.12 stdlib only."
      - "Both plans' own Lifecycle Boundary (§1): no commit/push/merge/tag/publish/release without explicit user instruction — Worker tasks here edit files only, never commit."
      - "Phase 61 §3.2 triages the synthesis doc's 35 enhancement ideas: 9 inside Phase 61's own cards, 2 folded into P61.2, 8 are this board's Phase 62 scope, 16 remain unranked backlog — not part of this goal."
      - "Both plans went through 33 findings verified+applied in a first adversarial-review round, then 7 blockers found and fixed in a follow-up critical-review round, all this session, before this board was built."
    existing_plan_facts:
      - "Phase 61 plan (docs/phase-plans/phase-61-cross-llm-memory-typed-artifact-schema-plan.md) §9 task cards: P61.0.1, P61.1.1-2, P61.2.1-2, P61.3.1-2, P61.4.1-2, P61.5.1-2, P61.6.1-2, P61.7.1-2, P61.8.1-2, P61.9.1-2, P61.10.1-2, P61.11.1-2, P61.12.1-2, P61.13.1; §10 Final Verification; §11 Exit Checklist."
      - "Phase 62 plan (docs/phase-plans/phase-62-memory-integration-layer-plan.md) §9 task cards: P62.0.1, P62.1.1-2, P62.2.1-2, P62.3.1-2, P62.4.1-2, P62.5.1-2, P62.6.1-2, P62.7.1-2, P62.8.1-2, P62.9.1-2; §10 Final Verification; §11 Exit Checklist."
      - "Phase 62 admission gate (§4) hard-blocks on Phase 61's exit checklist being 100% checked — this board's T016 Judge audit is that gate."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  no_git_commits_without_explicit_user_instruction: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed # verified: ~/.claude/agents/goal-scout.md present
  worker: installed # verified: ~/.claude/agents/goal-worker.md present
  judge: installed # verified: ~/.claude/agents/goal-judge.md present

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/cross-llm-memory-61-62/"
    command: "node <skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/cross-llm-memory-61-62"

active_task: null

