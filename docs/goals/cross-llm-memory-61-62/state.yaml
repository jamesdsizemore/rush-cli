        - "docs/phase-plans/phase-62-memory-integration-layer-plan.md §8.2b (lines 269-281), §9 (lines 283-406)"
        - "docs/goals/cross-llm-memory-61-62/state.yaml full task list T001-T028"
        - "Independent recount of Phase 61 §8.2 Group A-D dedup: 15+16+8+15+13+41 raw = 108, expanding plan's own comma-shorthand yields exactly 75 unique files, matching T015 allowed_files (78 total - 3 non-doc writes)"
